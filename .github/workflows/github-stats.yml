name: Update Terminal Stats Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: 4444ji
          theme: tokyonight
          headerStyle: mac
          hostname: archlinux
          commands: whoami,neofetch,languages,uptime,exit
          outputPath: assets/github_stats.svg

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update terminal stats [skip ci]" && git push)
